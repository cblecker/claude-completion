name: Update Completion Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-completion
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version-check.outputs.changed }}
      latest: ${{ steps.version-check.outputs.latest }}
      current: ${{ steps.version-check.outputs.current }}
      exists: ${{ steps.pr-check.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for new Claude Code version
        id: version-check
        run: |
          CURRENT_VERSION=$(cat data/VERSION)
          LATEST_VERSION=$(npm view @anthropic-ai/claude-code version)
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "No version change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif npx --yes semver "$LATEST_VERSION" -r ">$CURRENT_VERSION" > /dev/null 2>&1; then
            echo "New version available: $LATEST_VERSION (current: $CURRENT_VERSION)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Latest version $LATEST_VERSION is not newer than current $CURRENT_VERSION, skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing PR
        if: steps.version-check.outputs.changed == 'true'
        id: pr-check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST_VERSION: ${{ steps.version-check.outputs.latest }}
        run: |
          PR_COUNT=$(gh pr list --repo "${GH_REPO}" \
            --head "update/claude-${LATEST_VERSION}" \
            --state open --json number --jq 'length')
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check
    if: needs.check.outputs.changed == 'true' && needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ">=3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install Claude Code
        env:
          LATEST_VERSION: ${{ needs.check.outputs.latest }}
        run: npm install -g "@anthropic-ai/claude-code@${LATEST_VERSION}"

      - name: Update completion data
        run: make update

      - name: Validate
        run: make validate

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/claude-${{ needs.check.outputs.latest }}
          delete-branch: true
          title: "Update completion data for Claude Code v${{ needs.check.outputs.latest }}"
          body: |
            Automated update of completion data for Claude Code v${{ needs.check.outputs.latest }}.

            Previous version: v${{ needs.check.outputs.current }}

            Changes generated by `make update` (parse + generate).
          commit-message: "Update completion data for Claude Code v${{ needs.check.outputs.latest }}"

      - name: Enable auto-merge
        if: success() && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge --auto --squash "$PR_NUMBER" --repo "${GH_REPO}"
